[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasonic-film-measurement"
version = "0.1.0"
description = "Red Pitaya pulse-echo acquisition and water-film thickness analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.8"]

[project.urls]
Repository = "https://github.com/noetherianism/ultrasonic-film-measurement-clean"

[project.scripts]
film-live = "ultrasonic_film.massflow:main"
film-diagnostics = "ultrasonic_film.live:main"
film-scope = "ultrasonic_film.scope:main"
film-benchmark = "ultrasonic_film.benchmark:main"
film-replay-plot = "ultrasonic_film.plot_recording:main"
film-native-client = "ultrasonic_film.native_client:main"

[tool.setuptools.packages.find]
include = ["ultrasonic_film*"]

[tool.setuptools.package-data]
ultrasonic_film = ["native/*.cpp"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["F821", "F822", "F823", "E9"]
